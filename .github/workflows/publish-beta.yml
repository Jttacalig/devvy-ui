name: Publish DEVVY UI stable release to npm

# An npm publication is a deliberate maintainer action, never a side-effect of
# pushing commits or deploying the documentation website.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write # npm Trusted Publishing / OIDC

concurrency:
  group: devvy-ui-npm-latest
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm-alpha
    steps:
      - name: Require successful CI on this exact main commit
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          CI_RESULT=$(gh api --method GET \
            "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$GITHUB_SHA" -f branch=main -f per_page=20 \
            --jq '[.workflow_runs[] | select(.event == "push" or .event == "workflow_dispatch")] | max_by(.run_number) | .conclusion // "not completed"')
          if [[ "$CI_RESULT" != "success" ]]; then
            echo "::error::CI for $GITHUB_SHA is $CI_RESULT. Wait for all verification, consumer and browser shards to pass, then run publishing again."
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      # npm 11.5.1+ (rather than pnpm publish) performs OIDC publishing.
      - name: Install supported npm CLI
        run: npm install --global npm@11

      - name: Install and validate release candidate
        run: |
          pnpm install --frozen-lockfile
          pnpm build
          pnpm typecheck
          pnpm lint
          pnpm format:check
          pnpm test
          pnpm check:packages
          pnpm bench
          pnpm pack:all
          pnpm test:consumer 18.3.1
          pnpm test:consumer 19.3.1

      - name: Publish all six packages with latest dist-tag (OIDC)
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Refusing non-stable version: $VERSION"
            exit 1
          fi
          echo "Publishing DEVVY UI $VERSION under npm dist-tag 'latest'"
          # Publish dependencies before their dependents. Existing versions are
          # skipped so an interrupted six-package release can be retried.
          for PACKAGE in tokens styles core react registry cli; do
            NAME="@devvy-ui/$PACKAGE"
            TARBALL=".artifacts/devvy-ui-$PACKAGE-$VERSION.tgz"
            if [[ ! -f "$TARBALL" ]]; then
              echo "Missing tarball: $TARBALL"
              exit 1
            fi
            if npm view "$NAME@$VERSION" version --json >/dev/null 2>&1; then
              echo "Already published: $NAME@$VERSION"
            else
              npm publish "$TARBALL" --access public --tag latest --provenance
            fi
          done
