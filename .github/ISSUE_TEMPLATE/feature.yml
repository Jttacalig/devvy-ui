name: Feature proposal
description: Propose a component or change
labels: [enhancement]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature and use case
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and trade-offs
  - type: textarea
    id: a11y
    attributes:
      label: Accessibility and compatibility considerations
